[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flame-api"
version = "0.1.0"
description = "FLAME modular backend foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "uvicorn==0.53.0",
  "SQLAlchemy==2.0.54",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.0",
  "openpyxl==3.1.5",
  "python-multipart>=0.0.20,<1",
  "httpx==0.28.1",
  "google-auth[requests]>=2.40,<3",
  "PyJWT[crypto]==2.10.1",
  "cryptography>=44,<47",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db_integration: rollback-only tests against configured development PostgreSQL"]



