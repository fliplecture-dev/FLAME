name: Application checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: development/apps/flame-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: development/apps/flame-api/pyproject.toml
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m pip check
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: development/apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: development/apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
